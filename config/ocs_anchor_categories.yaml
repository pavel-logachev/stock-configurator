# OCS anchor categories are sync-helper facts, not business policy.
# Workflow: sync local categories, run discovery, review candidates, mark anchors approved,
# then enable anchors and sync products. Do not add unreviewed category IDs here.
anchors:
  - group: server
    role: ready_server
    category_id: V1100
    category_path: "Servers / Ready servers"
    allowed_roles: [ready_server]
    category_kind: base_device
    base_device_allowed: true
    comment: Server baseline anchor copied from config/ocs_server_categories.yaml.
    enabled_default: true
    review_status: approved
  - group: server
    role: server_platform
    category_id: V110100
    category_path: "Servers / Platforms"
    allowed_roles: [server_platform]
    category_kind: base_device
