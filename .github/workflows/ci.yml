name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run --frozen --extra dev ruff check .
      - name: Test
        run: uv run --frozen --extra dev pytest -q

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9
      - name: Audit Python dependencies
        run: |
          uv export --frozen --no-dev --no-hashes --format requirements-txt \
            --output-file "$RUNNER_TEMP/stock-requirements.txt"
          uvx --python 3.12 pip-audit -r "$RUNNER_TEMP/stock-requirements.txt"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
