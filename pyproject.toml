[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-configurator"
version = "0.1.0"
description = "AI-first stock configurator with deterministic validation and human review."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Pavel Logachev" }]
keywords = ["ai", "fastapi", "inventory", "presales", "configuration"]
dependencies = [
    "alembic>=1.13.0,<2.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "fastapi>=0.111.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "python-telegram-bot[socks]>=22.0,<23.0",
    "SQLAlchemy>=2.0.0,<3.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<10.0.0",
    "ruff>=0.4.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/pavel-logachev/stock-configurator"
Repository = "https://github.com/pavel-logachev/stock-configurator"
Issues = "https://github.com/pavel-logachev/stock-configurator/issues"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
